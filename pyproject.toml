[project]
name = "LLM-Function-Playground"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "llm-sdk>=1.0.1",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.mypy]
exclude = ["moulinette", "llm_sdk"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true

[tool.uv.sources]
llm-sdk = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.20.2",
]
