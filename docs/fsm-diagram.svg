<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Finite State Machine for constrained function calling</title>
  <desc id="desc">A colored flowchart showing how the decoder moves through JSON generation states for function calling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f2f7ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52607a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c8ba3" flood-opacity="0.18"/>
    </filter>
    <style>
      .box { rx: 18; ry: 18; stroke-width: 2; filter: url(#shadow); }
      .title { font: 700 18px 'Inter', 'Segoe UI', sans-serif; fill: #12324a; }
      .small { font: 500 14px 'Inter', 'Segoe UI', sans-serif; fill: #395164; }
      .edge { stroke: #52607a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 600 13px 'Inter', 'Segoe UI', sans-serif; fill: #52607a; }
      .legend { font: 600 13px 'Inter', 'Segoe UI', sans-serif; fill: #395164; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="860" fill="url(#bg)"/>

  <text x="70" y="62" class="title" font-size="28">Finite-State Machine</text>
  <text x="70" y="90" class="small">Colored stages show how constrained decoding moves through JSON generation.</text>

  <g>
    <rect class="box" x="80" y="150" width="150" height="72" fill="#D7F7E8" stroke="#1F9D66"/>
    <text x="155" y="181" text-anchor="middle" class="title">Start</text>
    <text x="155" y="203" text-anchor="middle" class="small">begin</text>

    <rect class="box" x="290" y="150" width="180" height="72" fill="#FFF3C7" stroke="#D39E00"/>
    <text x="380" y="181" text-anchor="middle" class="title">NEED_OPEN_BRACE</text>
    <text x="380" y="203" text-anchor="middle" class="small">force {</text>

    <rect class="box" x="540" y="150" width="180" height="72" fill="#D8ECFF" stroke="#2B6CB0"/>
    <text x="630" y="181" text-anchor="middle" class="title">NEED_NAME_KEY</text>
    <text x="630" y="203" text-anchor="middle" class="small">collect until "name"</text>

    <rect class="box" x="790" y="150" width="170" height="72" fill="#FFF3C7" stroke="#D39E00"/>
    <text x="875" y="181" text-anchor="middle" class="title">NEED_COLON_1</text>
    <text x="875" y="203" text-anchor="middle" class="small">force :</text>

    <rect class="box" x="1035" y="150" width="190" height="72" fill="#E5D5FF" stroke="#7C3AED"/>
    <text x="1130" y="181" text-anchor="middle" class="title">NEED_FUNC_NAME</text>
    <text x="1130" y="203" text-anchor="middle" class="small">prefix table lookup</text>

    <rect class="box" x="1290" y="150" width="180" height="72" fill="#FFF3C7" stroke="#D39E00"/>
    <text x="1380" y="181" text-anchor="middle" class="title">NEED_COMMA</text>
    <text x="1380" y="203" text-anchor="middle" class="small">force ,</text>
  </g>

  <g>
    <rect class="box" x="80" y="350" width="200" height="72" fill="#D8ECFF" stroke="#2B6CB0"/>
    <text x="180" y="381" text-anchor="middle" class="title">NEED_PARAMS_KEY</text>
    <text x="180" y="403" text-anchor="middle" class="small">collect until "parameters"</text>

    <rect class="box" x="340" y="350" width="160" height="72" fill="#FFF3C7" stroke="#D39E00"/>
    <text x="420" y="381" text-anchor="middle" class="title">NEED_COLON_2</text>
    <text x="420" y="403" text-anchor="middle" class="small">force :</text>

    <rect class="box" x="560" y="350" width="170" height="72" fill="#FFF3C7" stroke="#D39E00"/>
    <text x="645" y="381" text-anchor="middle" class="title">NEED_PARAMS_OPEN</text>
    <text x="645" y="403" text-anchor="middle" class="small">force {</text>

    <rect class="box" x="800" y="350" width="190" height="72" fill="#D8ECFF" stroke="#2B6CB0"/>
    <text x="895" y="381" text-anchor="middle" class="title">NEED_ARG_KEY</text>
    <text x="895" y="403" text-anchor="middle" class="small">prefix table lookup</text>

    <rect class="box" x="1060" y="350" width="170" height="72" fill="#FFF3C7" stroke="#D39E00"/>
    <text x="1145" y="381" text-anchor="middle" class="title">NEED_ARG_COLON</text>
    <text x="1145" y="403" text-anchor="middle" class="small">branch by type</text>

    <rect class="box" x="1290" y="350" width="180" height="72" fill="#E5D5FF" stroke="#7C3AED"/>
    <text x="1380" y="381" text-anchor="middle" class="title">NEED_ARG_VALUE</text>
    <text x="1380" y="403" text-anchor="middle" class="small">number / string / bool</text>
  </g>

  <g>
    <rect class="box" x="290" y="560" width="230" height="72" fill="#D8ECFF" stroke="#2B6CB0"/>
    <text x="405" y="591" text-anchor="middle" class="title">NEED_COMMA_OR_CLOSE</text>
    <text x="405" y="613" text-anchor="middle" class="small">more keys or close</text>

    <rect class="box" x="600" y="560" width="170" height="72" fill="#FFF3C7" stroke="#D39E00"/>
    <text x="685" y="591" text-anchor="middle" class="title">NEED_CLOSE_OUTER</text>
    <text x="685" y="613" text-anchor="middle" class="small">force }</text>

    <rect class="box" x="840" y="560" width="150" height="72" fill="#D7F7E8" stroke="#1F9D66"/>
    <text x="915" y="591" text-anchor="middle" class="title">DONE</text>
    <text x="915" y="613" text-anchor="middle" class="small">finish</text>
  </g>

  <g>
    <path class="edge" d="M 230 186 L 290 186"/>
    <path class="edge" d="M 470 186 L 540 186"/>
    <path class="edge" d="M 720 186 L 790 186"/>
    <path class="edge" d="M 960 186 L 1035 186"/>
    <path class="edge" d="M 1225 186 L 1290 186"/>

    <path class="edge" d="M 1380 222 L 1380 300 L 180 300 L 180 350"/>
    <text x="1326" y="286" class="edge-label">comma then parameters</text>

    <path class="edge" d="M 280 386 L 340 386"/>
    <path class="edge" d="M 500 386 L 560 386"/>
    <path class="edge" d="M 730 386 L 800 386"/>
    <path class="edge" d="M 990 386 L 1060 386"/>
    <path class="edge" d="M 1230 386 L 1290 386"/>

    <path class="edge" d="M 1380 422 L 1380 500 L 405 500 L 405 560"/>
    <text x="1295" y="488" class="edge-label">collect argument value</text>

    <path class="edge" d="M 520 596 L 600 596"/>
    <path class="edge" d="M 770 596 L 840 596"/>

    <path class="edge" d="M 685 632 L 685 720 L 960 720 L 960 596"/>
    <text x="734" y="702" class="edge-label">close JSON</text>

    <path class="edge" d="M 1150 422 C 1150 500, 420 500, 420 596"/>
    <text x="985" y="520" class="edge-label">if remaining_keys > 0, loop</text>
  </g>

  <g>
    <rect x="80" y="760" width="1440" height="56" rx="16" ry="16" fill="#ffffff" stroke="#d8e1ee"/>
    <rect x="110" y="776" width="20" height="20" rx="6" fill="#FFF3C7" stroke="#D39E00"/>
    <text x="140" y="792" class="legend">forced token</text>
    <rect x="290" y="776" width="20" height="20" rx="6" fill="#D8ECFF" stroke="#2B6CB0"/>
    <text x="320" y="792" class="legend">collect / prefix lookup</text>
    <rect x="530" y="776" width="20" height="20" rx="6" fill="#E5D5FF" stroke="#7C3AED"/>
    <text x="560" y="792" class="legend">branching state</text>
    <rect x="750" y="776" width="20" height="20" rx="6" fill="#D7F7E8" stroke="#1F9D66"/>
    <text x="780" y="792" class="legend">start / done</text>
  </g>
</svg>
